[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniffler"
version = "0.2.0"
description = "Simple control for a LabJack U3 and Alicat mass flow controllers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alicat>=0.9,<1",
    "LabJackPython>=2.1,<3",
]

[project.scripts]
sniffler = "sniffler.cli:main"

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sniffler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
